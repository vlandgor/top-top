# Deploys the dev channel of the game to GitHub Pages on every push to any branch, so a
# feature branch can be tried on a phone before it is merged:
# https://vlandgor.github.io/top-top/  (there is one page: whichever branch was pushed last is live;
# the main menu shows "DEV · <branch> · <commit>" for anything but main)
#
# The "Top Top Dev" Android app (android.yml) loads this page, so it always runs the
# newest commit. The dev channel shows its commit on the main menu.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions, and
# Settings -> Environments -> github-pages -> Deployment branches and tags: No restriction.
name: Dev web build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      # VITE_CHANNEL=dev build plus dist/version.json, which the app checks on resume
      - run: npm run build:devweb
        env:
          VITE_COMMIT: ${{ github.sha }}
          VITE_BRANCH: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
