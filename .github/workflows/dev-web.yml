# Deploys the dev channel of the game to GitHub Pages on every push to main, and to the
# feature branches listed below so they can be tried on a phone before merging:
# https://vlandgor.github.io/top-top/  (whichever of them was pushed last is live)
#
# The "Top Top Dev" Android app (android.yml) loads this page, so it always runs the
# newest commit. The dev channel shows its commit on the main menu.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Dev web build

on:
  push:
    branches: [main, coop-bots]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      # VITE_CHANNEL=dev build plus dist/version.json, which the app checks on resume
      - run: npm run build:devweb
        env:
          VITE_COMMIT: ${{ github.sha }}
          VITE_BRANCH: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
